# Who may change data. Everyone may read, and run the two pricing calls. The nightly job's
# calls carry their own key, which the API checks itself. Every other call that changes
# data needs the owner's token (see dpp-app/ai): nginx asks the DPP AI service to check it.
map $request_method $dpp_changes {
    default 1;
    GET     0;
    HEAD    0;
    OPTIONS 0;
}
map $uri $dpp_open_call {
    default 0;
    ~*^/api/valuation/?$                                      1;
    ~*^/api/simulation/price-option/?$                        1;
    ~*^/api/underlyings/historicalprices/upsertbysymbol/?$    1;
    ~*^/api/ratecurves/[^/]+/ratepoints/replace/?$            1;
    ~*^/api/ratecurves/byname/[^/]+/ratepoints/replace/?$     1;
}
map "$dpp_changes:$dpp_open_call" $dpp_owner_only {
    default 0;
    "1:0"   1;
}

server {
    listen 80;
    server_name _;

    root /var/www/dpp-ui;
    index index.html;

    access_log /var/log/nginx/dpp.access.log;
    error_log  /var/log/nginx/dpp.error.log;

    # Compress API JSON and static text (gzip itself is switched on in nginx.conf).
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;

    # The previous UI is retired: its page, and the leftover copies of it, lead to the site.
    location ~ ^/portfolioManager\.html {
        add_header Cache-Control "public, max-age=3600" always;
        return 301 /;
    }

    # The pages are small and point at hashed files: browsers must always revalidate them.
    location ~ ^/(next/)?(index|overview)\.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Build files under assets/ carry a content hash in their name, so they never change.
    location ~ ^/(next/)?assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # DPP AI (dpp-app/ai). Answers arrive as a stream, so nothing is buffered on the way.
    location /api/ai/ {
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        gzip off;
        proxy_read_timeout 180s;
        client_max_body_size 512k;

        proxy_pass http://127.0.0.1:5024;
    }

    location /api/ {
        # Changes go through the owner check below; reads and pricing calls go straight on.
        if ($dpp_owner_only) {
            rewrite ^(.*)$ /_owner$1 last;
        }

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # IMPORTANT: same port TB used in Dockers configuration.
        proxy_pass http://127.0.0.1:5022;
    }

    # A change to the data: let it through only with a valid owner token (header X-DPP-Owner).
    # If the DPP AI service is down, changes are refused and everything else keeps working.
    location /_owner/api/ {
        internal;
        auth_request /_owner_check;
        error_page 401 403 = @owner_needed;
        error_page 500 = @owner_check_down;

        rewrite ^/_owner(/.*)$ $1 break;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://127.0.0.1:5022;
    }

    location = /_owner_check {
        internal;
        proxy_pass http://127.0.0.1:5024/api/ai/owner-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @owner_needed {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 401 '{"code":"owner_required","message":"Changes are locked. Unlock them with the owner passcode."}';
    }

    location @owner_check_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":"owner_check_down","message":"Changes are not available right now."}';
    }
}
